# transmissor --TCP:5000--> canal --TCP:5001--> receptor
#
#   docker compose up --build                 # sobe tudo e transmite a mensagem
#   docker compose run --rm transmissor       # transmite de novo (canal e receptor seguem no ar)
#   MENSAGEM="OLA MUNDO" EBN0_DB=4 CANAL_TIPO=rajadas docker compose up
#
# Logs da sessão ficam em ./logs (montado no receptor e no canal).

x-imagem: &imagem
  build: .
  image: redes-grau-b
  user: "${UID:-1000}:${GID:-1000}"   # arquivos de log com o seu usuário, não root
  init: true                          # repassa o SIGTERM ao Python (desliga na hora)
  volumes:
    - /etc/localtime:/etc/localtime:ro  # mesmo fuso horário da máquina nos logs

services:
  receptor:
    <<: *imagem
    command: python receptor.py
    environment:
      RECEPTOR_PORTA: 5001
      PASTA_LOGS: /app/logs
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs

  canal:
    <<: *imagem
    command: python canal.py
    environment:
      CANAL_PORTA: 5000
      RECEPTOR_HOST: receptor
      RECEPTOR_PORTA: 5001
      CANAL_TIPO: ${CANAL_TIPO:-awgn}      # ideal | awgn | rajadas
      EBN0_DB: ${EBN0_DB:-8}
      SEMENTE: ${SEMENTE:-42}
      P_BOM_RUIM: ${P_BOM_RUIM:-0.01}
      P_RUIM_BOM: ${P_RUIM_BOM:-0.1}
      RAJADA_DB: ${RAJADA_DB:-10}
      PASTA_CAPTURAS: /app/logs/canal      # sinal antes e depois do ruído (quadros de mensagem)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./logs:/app/logs
    depends_on: [receptor]

  transmissor:
    <<: *imagem
    command: python transmissor.py
    environment:
      CANAL_HOST: canal
      CANAL_PORTA: 5000
      MENSAGEM: ${MENSAGEM:-REDES DE COMPUTADORES - UNISINOS 2026}
      TECNICAS: ${TECNICAS:-todas}
      VARRER_CANAIS: ${VARRER_CANAIS:-ideal,awgn,rajadas}   # cenários da mensagem
      VARRER_EBN0_DB: ${VARRER_EBN0_DB:-20,8}               # Eb/N0 da mensagem
      DURACAO_S: ${DURACAO_S:-30}                           # segundos enviando dados aleatórios
      BITS_POR_QUADRO: ${BITS_POR_QUADRO:-100000}
      MIN_RODADAS: ${MIN_RODADAS:-5}                        # repetições mínimas (o PDF pede 5)
      DADOS_CANAIS: ${DADOS_CANAIS:-awgn,rajadas}
      DADOS_EBN0_DB: ${DADOS_EBN0_DB:-0,2,4,6,8,10,12,14}
      SEMENTE: ${SEMENTE:-42}
    depends_on: [canal]
    stdin_open: true   # modo interativo: docker compose run --rm transmissor python transmissor.py --interativo
    tty: true
